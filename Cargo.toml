[package]
name = "pod2"
version = "0.1.0"
edition = "2021"
build = "build.rs"
license = "MIT"

[lib]
name = "pod2"
path = "src/lib.rs"

[dependencies]
hex = "0.4.3"
itertools = "0.14.0"
strum_macros = "0.26"
anyhow = "1.0.56"
dyn-clone = "1.0.18"
log = "0.4"
env_logger = { version = "0.11", optional = true }
lazy_static = "1.5.0"
thiserror = { version = "2.0.12" }
# enabled by features:
plonky2 = { git = "https://github.com/0xPARC/plonky2.git", rev = "60e32369b7b5c8f0ff1e44265005f7c3c3a0a04b", optional = true }
plonky2_u32 = { git = "https://github.com/ax0/plonky2-u32", rev = "0e1346c3c946ff87c4f99af9f3d8673542f4828e" }
serde = "1.0.219"
serde_json = "1.0.140"
base64 = "0.22.1"
bs58 = "0.5.1"
schemars = "0.8.22"
num = { version = "0.4.3", features = ["num-bigint"] }
num-bigint = { version = "0.4.6", features = ["rand"] }
# num-bigint 0.4 requires rand 0.8
rand = "0.8.5"
hashbrown = { version = "0.14.3", default-features = false, features = [
  "serde",
] }
pest = "2.8.0"
pest_derive = "2.8.0"
rayon = "1.10"
directories = { version = "6.0.0", optional = true }
minicbor-serde = { version = "0.5.0", features = ["std"], optional = true }
serde_bytes = "0.11"
serde_arrays = "0.2.0"
sha2 = { version = "0.10.9" }
rand_chacha = "0.3.1"
good_lp = { version = "1.8", default-features = false, features = [
  "scip",
  "scip_bundled",
], optional = true }
annotate-snippets = "0.11"
rocksdb = { version = "0.24.0", optional = true } # keyvalue database for merkletree

# plonky2 from its GPU fork (the gpu branch of robknight/plonky2), which adds the `gpu` feature
# without changing proofs, circuit data or the verifier. The patch also applies to plonky2_u32's
# plonky2 dependency, so both use the same crate. For debugging with a local checkout (for example
# https://github.com/ed255/plonky2/ at branch `feat/debug`, next to the pod2 repo directory), use
# `plonky2 = { path = "../plonky2/plonky2" }` instead.
[patch."https://github.com/0xPARC/plonky2"]
plonky2 = { git = "https://github.com/robknight/plonky2", rev = "035c827656e00ac390cf11cb45c6df3c715b181d" }

[dev-dependencies]
pretty_assertions = "1.4.1"
# Used only for testing JSON Schema generation and validation.
jsonschema = "0.30.0"
tempfile = "3"
# Always available in tests so the MILP parity sweep and DP-vs-MILP probes
# compile without callers needing `--features milp`.
good_lp = { version = "1.8", default-features = false, features = [
  "scip",
  "scip_bundled",
] }
env_logger = "0.11"
# Alternative global allocators, for the experiment in #398. Proving is
# allocation-heavy, so the allocator is worth measuring. These are only ever
# installed by pod2's own test harness and examples, never by pod2 as a
# dependency (see the `cfg(test)` gate in src/lib.rs).
mimalloc = { version = "0.1.52" }
tikv-jemallocator = { version = "0.7.0" }

[build-dependencies]
vergen-gitcl = { version = "1.0.0", features = ["build"], optional = true }

[features]
default = ["backend_plonky2", "zk", "mem_cache"]
backend_plonky2 = ["dep:plonky2"]
# Prove on a GPU through plonky2's `gpu` feature (Metal, Vulkan or DirectX 12,
# chosen at run time; the CPU paths run when no adapter is usable).
gpu = ["plonky2/gpu"]
# plonky2's GPU diagnostics (see the `plonky2::gpu` module documentation).
gpu-profiling = ["gpu", "plonky2/gpu-profiling"]

zk = []
metrics = []
time = ["dep:env_logger"]
examples = []
disk_cache = ["dep:directories", "dep:minicbor-serde", "dep:vergen-gitcl"]
mem_cache = []
db_rocksdb = ["dep:rocksdb"]
# Compile the MILP partitioner into the lib. Off by default to keep the SCIP
# dependency out of slim builds; on for the test target unconditionally via
# `[dev-dependencies] good_lp` so the parity sweep always builds.
milp = ["dep:good_lp"]
# Swap the global allocator in the test harness and examples. Mutually
# exclusive, and diagnostic only.
mimalloc = []
jemalloc = []

# Uncomment in order to enable debug information in the release builds.  This allows getting panic backtraces with a performance similar to regular release.
# [profile.release]
# debug = true

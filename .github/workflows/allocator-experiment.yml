name: Allocator experiment

# Issue #398: does jemalloc or mimalloc beat the system allocator for proving?
# Also checks whether an allocator win composes with the AVX2 win, since the two
# attack different bottlenecks (allocation vs field arithmetic).
#
# As with the AVX2 experiment, every variant is built and run in ONE job on ONE
# runner. Host-to-host variance on GitHub runners is large enough to swamp the
# effect being measured.
on:
  # TEMPORARY: remove before merging. workflow_dispatch only registers from the
  # default branch, so this is the only way to exercise the workflow before it
  # lands on main.
  push:
    branches: [test-timings]
  workflow_dispatch:
    inputs:
      repeats:
        description: "Alternating measurements per variant"
        required: false
        default: "2"

jobs:
  allocators:
    name: Allocator experiment
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        # RUSTFLAGS is set per step below. Caching is off: the variants need
        # their own builds, and this job must not disturb the entry PRs
        # restore from.
        rustflags: ""
        cache: false

    - name: Record the CPU
      run: |
        grep -m1 "model name" /proc/cpuinfo
        if ! grep -qm1 avx2 /proc/cpuinfo; then
          echo "::error::this runner has no AVX2; rerun to get a different host"
          exit 1
        fi

    # Variants are grouped by RUSTFLAGS and share a target directory within a
    # group, so only pod2 and the allocator crate rebuild between them. A
    # separate target dir per variant would rebuild plonky2 five times.
    - name: Build allocator variants
      env:
        CARGO_TARGET_DIR: target-plain
        RUSTFLAGS: ""
      run: |
        mkdir -p bin
        for feat in "" "jemalloc" "mimalloc"; do
          name="${feat:-system}"
          cargo build --release --example main_pod_points ${feat:+--features "$feat"}
          cp target-plain/release/examples/main_pod_points "bin/$name"
        done

    - name: Build AVX2 variants
      env:
        CARGO_TARGET_DIR: target-avx2
        RUSTFLAGS: "-C target-feature=+avx2"
      run: |
        for feat in "" "mimalloc"; do
          name="avx2${feat:+-$feat}"
          cargo build --release --example main_pod_points ${feat:+--features "$feat"}
          cp target-avx2/release/examples/main_pod_points "bin/$name"
        done

    - name: Measure
      # Alternate the variants so drift over the job's lifetime is shared
      # between them rather than landing on whichever ran last.
      env:
        REPEATS: ${{ inputs.repeats || '2' }}
      run: |
        set -o pipefail
        : > results.csv
        for i in $(seq 1 "$REPEATS"); do
          for v in system jemalloc mimalloc avx2 avx2-mimalloc; do
            start=$(date +%s.%N)
            "./bin/$v" > /dev/null
            end=$(date +%s.%N)
            awk -v v="$v" -v s="$start" -v e="$end" \
              'BEGIN { printf "%s,%.3f\n", v, e - s }' | tee -a results.csv
          done
        done

    - name: Compare
      if: always()
      # Read this against the AVX2 experiment: if mimalloc and avx2 each help
      # and avx2-mimalloc is close to the sum of the two, they compose.
      run: |
        awk -F, '
          { sum[$1] += $2; n[$1]++ }
          END {
            base = sum["system"] / n["system"]
            printf "%-18s%10s%10s\n", "variant", "mean", "delta"
            printf "%s\n", "--------------------------------------"
            split("system jemalloc mimalloc avx2 avx2-mimalloc", order, " ")
            for (i = 1; i <= 5; i++) {
              v = order[i]
              if (!(v in sum)) continue
              m = sum[v] / n[v]
              printf "%-18s%9.2fs%9.1f%%\n", v, m, (m - base) / base * 100
            }
          }' results.csv

    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allocator-experiment
        path: results.csv
